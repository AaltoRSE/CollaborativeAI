version: "3"
services:
  mealplan:
    build:
      context: ./task_template
      dockerfile: Dockerfile_mealplan  
    environment:
      - REDIS_HISTORY_DB=3 
      - REDISPASSWORD=${REDISPASSWORD} 
    networks:
      - mynetwork
    depends_on:
      - model_handler
  recipe:
    build:
      context: ./task_template
      dockerfile: Dockerfile_recipe    
    environment:
      - REDIS_HISTORY_DB=4
      - REDISPASSWORD=${REDISPASSWORD}
    networks:
      - mynetwork  
    depends_on:
      - model_handler
  aalto_o1:
    build: ./model_template
    networks:
      - mynetwork
    environment:
      - MODEL_TO_USE=aalto_o1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERVICE_NAME=aalto_o1
    depends_on:
      - model_handler
  aalto_gpt4o:
    build: ./model_template    
    networks:
      - mynetwork
    environment:
      - MODEL_TO_USE=aalto_gpt4o
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERVICE_NAME=aalto_gpt4o
    depends_on:
      - model_handler
  model_handler:
    build: 
      context: ./model_handler_template  
    container_name: model_handler
    networks:
      - mynetwork
    environment:
      - ATLAS_URI=mongodb://collabai-mongo/  
      - REDISPASSWORD=${REDISPASSWORD}
  mongo:
    container_name: collabai-mongo
    image: mongo:7.0.4
    volumes:
      - ./mongodb:/data/db
    ports:
      - 127.0.0.1:27017:27017
    networks:
      - mynetwork
  nginx:
    image: docker.io/library/nginx:alpine
    environment:
      - HOSTNAME=localhost
    ports:
      - 0.0.0.0:${NGINX_HTTPS_PORT}:443
    volumes:
      - ./dev_data/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./dev_data/nginx/templates:/etc/nginx/templates
      - ./dev_data/certs/sp.crt:/certificates/certificate.crt
      - ./dev_data/certs/sp.key:/certificates/private.key
    depends_on:
      - recipe
      - mealplan
    networks:
      - mynetwork
  redis:
    image: redis:7.2.3
    container_name: redis    
    command: ["redis-server", "--requirepass", "${REDISPASSWORD}"]
    ports:
      - 127.0.0.1:6379:6379
    networks:
      - mynetwork
networks:
  mynetwork:
