version: "3"
services:
  mealplan:
    extends:
      file: docker-compose-tasks.yaml
      service: mealplan 
  recipe:
    extends:
      file: docker-compose-tasks.yaml
      service: recipe
  math_tutor:
    extends:
      file: docker-compose-tasks.yaml
      service: math_tutor
  code_tutor:
    extends:
      file: docker-compose-tasks.yaml
      service: code_tutor
  floorplan:
    extends:
      file: docker-compose-tasks.yaml
      service: floorplan
  poetry:
    extends:
      file: docker-compose-tasks.yaml
      service: poetry 

  aalto_o1:
    extends:
      file: docker-compose-models.yaml
      service: aalto_o1
  aalto_gpt4o:
    extends:
      file: docker-compose-models.yaml
      service: aalto_gpt4o
  aalto_o1mini:
    extends:
      file: docker-compose-models.yaml
      service: aalto_o1mini
  aalto_o3mini:
    extends:
      file: docker-compose-models.yaml
      service: aalto_o3mini
  aalto_gpt4_1:
    extends:
      file: docker-compose-models.yaml
      service: aalto_gpt4_1
  aalto_gpt4o_mini:
    extends:
      file: docker-compose-models.yaml
      service: aalto_gpt4o_mini    
  model_handler:
    build: 
      context: ./model_handler_template  
    container_name: model_handler
    networks:
      - mynetwork
    environment:
      - ATLAS_URI=mongodb://${MONGOUSER}:${MONGOPASSWORD}@collabai-mongo
      - REDISPASSWORD=${REDISPASSWORD}
    depends_on:
      - mongo
      - redis
  mongo:
    container_name: collabai-mongo
    image: mongo:7.0.4
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGOUSER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGOPASSWORD}
    volumes:
      - ./mongodb:/data/db
    ports:
      - 127.0.0.1:27017:27017
    networks:
      - mynetwork
  nginx:
    image: docker.io/library/nginx:alpine
    environment:
      - HOSTNAME=localhost
    ports:
      - 0.0.0.0:${NGINX_HTTPS_PORT}:443
    volumes:
      - ./dev_data/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./dev_data/nginx/templates:/etc/nginx/templates
      - ./dev_data/certs/sp.crt:/certificates/certificate.crt
      - ./dev_data/certs/sp.key:/certificates/private.key
    depends_on:
      - recipe
      - mealplan
    networks:
      - mynetwork
  redis:
    image: redis:7.2.3
    container_name: redis    
    command: ["redis-server", "--requirepass", "${REDISPASSWORD}"]
    ports:
      - 127.0.0.1:6379:6379
    networks:
      - mynetwork
  mongo-express:
    image: mongo-express:latest
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGOUSER}:${MONGOPASSWORD}@collabai-mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true     
      ME_CONFIG_BASICAUTH_USERNAME: express
      ME_CONFIG_BASICAUTH_PASSWORD: mongoexpress
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    networks:
      - mynetwork

networks:
  mynetwork:
